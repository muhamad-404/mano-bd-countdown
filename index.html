<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Meta Tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Mano ki special day tak countdown — Mahnoor ke birthday (25 October 2026, Pakistan time) ke liye.">
  <meta name="author" content="For Mano">
  <meta name="theme-color" content="#ffe">

  <!-- Open Graph -->
  <meta property="og:title" content="Mano's Birthday Countdown">
  <meta property="og:description" content="Time left until Mano's special day — 25 October 2026, 00:00 Pakistan time.">
  <meta property="og:type" content="website">

  <!-- Title & Resources -->
  <title>Mano's Birthday Countdown</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script src="config.js"></script>
</head>
<body>
  <!-- Background Music -->
  <audio loop id="bgm" preload="auto" aria-label="Background music">
    <source src="bgm.mp3" type="audio/mpeg">
  </audio>
  
  <!-- Main Container -->
  <div id="viewport">
    <div id="main">
      <!-- Canvas Stage -->
      <div id="stage">
        <div id="stage-inner">
          <canvas id="ground-canvas" aria-hidden="true"></canvas>
          <canvas id="static-canvas" aria-hidden="true"></canvas>
          <canvas id="canvas" aria-label="Animated tree with hearts"></canvas>
        </div>
      </div>

      <!-- Timer above letter on mobile (flex order); desktop uses absolute positions -->
      <div id="content">
        <div id="clock-box" role="timer">
          <div id="clock-text"></div>
          <div id="clock"></div>
        </div>
        <div id="letter" role="article"></div>
      </div>
    </div>
  </div>
  
  <!-- Main Script -->
  <script src="js/geometry.js"></script>
  <script src="js/animation.js"></script>
  <script src="js/tree.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
